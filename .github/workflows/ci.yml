name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[ml,dev]"
      - name: Lint
        run: ruff check src tests examples && ruff format --check src tests examples
      - name: Type-check
        run: mypy
      - name: Tests
        run: pytest --cov=alphaforge --cov-report=term-missing
      - name: Smoke-run reference config
        run: alphaforge run configs/multi_strategy.yaml --no-save
